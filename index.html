<div id="appSplash">
  <img src="images/pardis-flame.png" alt="" class="splash-flame">
  <img src="images/pardis-wordmark.png" alt="Pardis" class="splash-word">
</div>
<script>
(function () {
  var splash = document.getElementById("appSplash");
  var MIN_SHOW = 1300; // ms — lets the flame + wordmark animation finish
  var start = Date.now();
  var removed = false;

  function remove() {
    if (removed) return;
    removed = true;
    if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
  }

  window.addEventListener("load", function () {
    var wait = Math.max(0, MIN_SHOW - (Date.now() - start));
    setTimeout(function () {
      if (!splash) return;
      splash.classList.add("splash-hide");
      splash.addEventListener("animationend", remove, { once: true });
      setTimeout(remove, 600); // fallback in case animations are disabled
    }, wait);
  });
})();
</script>

<div id="gateOverlay" class="gate-overlay" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
async function loadProjectStats(projectName, prefix) {
    const { data, error } = await db
        .from("units")
        .select("status")
        .eq("project", projectName);

    if (error || !data) return;

    const total = data.length;
    const available = data.filter(u => u.status === "available").length;
    const hold = data.filter(u => u.status === "hold").length;
    const sold = data.filter(u => u.status === "sold").length;
    const pct = total ? Math.round((sold / total) * 100) : 0;

    document.getElementById(prefix + "-total").textContent = total;
    document.getElementById(prefix + "-available").textContent = available;
    document.getElementById(prefix + "-hold").textContent = hold;
    document.getElementById(prefix + "-sold").textContent = sold;
    document.getElementById(prefix + "-progress-fill").style.width = pct + "%";
    document.getElementById(prefix + "-progress-label").textContent = pct + "% sold";
}

loadProjectStats("Sai Saburi", "ps");
loadProjectStats("Chitragandha", "cg");

// ===========================
// PROJECT PASSWORD GATE
// Prompts fresh every single click — nothing is remembered
// between visits or between cards.
// ===========================
(function () {
    const overlay = document.getElementById("gateOverlay");
    const input = document.getElementById("gateInput");
    const title = document.getElementById("gateTitle");
    const error = document.getElementById("gateError");
    const submitBtn = document.getElementById("gateSubmit");
    const cancelBtn = document.getElementById("gateCancel");

    let pendingHref = null;
    let pendingPassword = null;

    function openGate(card) {
        pendingHref = card.getAttribute("href");
        pendingPassword = card.getAttribute("data-gate-password");
        const projectName = card.querySelector("h2") ? card.querySelector("h2").textContent : "this project";
        title.textContent = "Enter password for " + projectName;
        error.hidden = true;
        input.value = "";
        overlay.hidden = false;
        setTimeout(() => input.focus(), 50);
    }

    function closeGate() {
        overlay.hidden = true;
        pendingHref = null;
        pendingPassword = null;
    }

    function attemptSubmit() {
        if (input.value === pendingPassword) {
            window.location.href = pendingHref;
        } else {
            error.hidden = false;
            input.value = "";
            input.focus();
        }
    }

    document.querySelectorAll(".project-card[data-gate-password]").forEach((card) => {
        card.addEventListener("click", (e) => {
            e.preventDefault();
            openGate(card);
        });
    });

    submitBtn.addEventListener("click", attemptSubmit);
    cancelBtn.addEventListener("click", closeGate);
    overlay.addEventListener("click", (e) => {
        if (e.target === overlay) closeGate();
    });
    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") attemptSubmit();
        if (e.key === "Escape") closeGate();
    });
})();
</script>
